<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>河南人教版高中数学学习辅助系统 · 人教A版2019 · 新课标Ⅰ卷</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <!-- 侧边导航 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">数</div>
      <div class="brand-text">
        <div class="brand-title">河南高中数学</div>
        <div class="brand-sub">人教A版 · 新课标Ⅰ</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard"><span class="nav-ico">◎</span>总控调度</button>
      <button class="nav-item" data-view="library"><span class="nav-ico">▤</span>考点库管理</button>
      <button class="nav-item" data-view="plan"><span class="nav-ico">◷</span>复习计划生成</button>
      <button class="nav-item" data-view="mindmap"><span class="nav-ico">⌘</span>知识点思维导图</button>
      <button class="nav-item" data-view="mock"><span class="nav-ico">✎</span>模拟训练(50套)</button>
      <button class="nav-item" data-view="past"><span class="nav-ico">◳</span>5年真题解析</button>
      <button class="nav-item" data-view="lecture"><span class="nav-ico">♪</span>名师讲堂</button>
    </nav>
    <div class="sidebar-foot">
      <div class="foot-line">适配：河南新高考</div>
      <div class="foot-line">卷型：新课标Ⅰ卷</div>
    </div>
  </aside>

  <!-- 主区域 -->
  <main class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
      <div class="crumbs" id="crumbs">总控调度</div>
      <div class="top-tools">
        <span class="ver-chip">v1.0</span>
        <span class="edition-chip">人教A版2019</span>
      </div>
    </header>
    <section class="content" id="content"><!-- 动态渲染 --></section>
  </main>
</div>

<!-- 弹层容器 -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="modal"><div class="modal-body" id="modalBody"></div>
  <button class="modal-close" id="modalClose">×</button></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="js/data.js"></script>
<script src="js/papers-gen1.js"></script>
<script src="js/papers-gen2.js"></script>
<script src="js/real-papers.js"></script>
<script src="js/unit-b1.js"></script>
<script src="js/unit-b2.js"></script>
<script src="js/unit-xb.js"></script>
<script src="js/app.js"></script>
</body>
</html>
